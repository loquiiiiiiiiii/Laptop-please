<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>26 Reasons</title>
<style>
  :root{
    --bg1:#1b1035; --bg2:#0d0620; --card:#241640; --text:#f3eefc; --muted:#b6a9d6;
    --accent:#8b5cf6; --accent2:#f472b6; --btn-text:#ffffff;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg1:#f5f1ff; --bg2:#e9defc; --card:#ffffff; --text:#241640; --muted:#6b5c8f;
      --accent:#7c3aed; --accent2:#db2777; --btn-text:#ffffff;
    }
  }
  :root[data-theme="light"]{
    --bg1:#f5f1ff; --bg2:#e9defc; --card:#ffffff; --text:#241640; --muted:#6b5c8f;
    --accent:#7c3aed; --accent2:#db2777; --btn-text:#ffffff;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2));
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .app{width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:18px;}
  .badge{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#fff; padding:6px 14px; border-radius:999px; font-size:.75rem; font-weight:600;
    letter-spacing:.03em;
  }
  h1{font-size:1.4rem; margin:0; text-align:center;}
  .progress{width:100%; height:8px; background:rgba(255,255,255,.15); border-radius:999px; overflow:hidden;}
  :root[data-theme="light"] .progress, @media (prefers-color-scheme:light){.progress{background:rgba(0,0,0,.08);}}
  .bar{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .4s ease;}
  .counter{font-size:.8rem; color:var(--muted); font-weight:600;}
  .card{
    width:100%; background:var(--card); border-radius:20px; padding:32px 24px;
    text-align:center; box-shadow:0 20px 40px rgba(0,0,0,.25);
    display:flex; flex-direction:column; align-items:center; gap:14px; min-height:180px; justify-content:center;
  }
  .number{
    font-size:4rem; font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .number.pop{animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
  .reason{font-size:1rem; line-height:1.5; margin:0; color:var(--text);}
  .btn{
    border:none; cursor:pointer; padding:14px 28px; border-radius:999px; font-size:1rem; font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); color:var(--btn-text);
    box-shadow:0 10px 24px rgba(139,92,246,.35); transition:transform .15s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.5; cursor:default;}
  .fireworks{position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden;}
  .shell{position:fixed; bottom:-20px; width:6px; height:6px; border-radius:50%;
    background:#fff; box-shadow:0 0 10px 3px rgba(255,255,255,.9);
    animation:rise 900ms ease-out forwards;}
  @keyframes rise{to{bottom:55%;}}
  .particle{position:fixed; width:6px; height:6px; border-radius:50%; pointer-events:none;
    animation:explode 900ms ease-out forwards;}
  @keyframes explode{to{transform:translate(var(--dx),var(--dy)) scale(0); opacity:0;}}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:100; padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  .modal-overlay.show{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--card); border-radius:20px; padding:32px 24px; text-align:center; max-width:360px; width:100%;
    transform:scale(.8); transition:transform .3s ease; box-shadow:0 25px 60px rgba(0,0,0,.4);
  }
  .modal-overlay.show .modal{transform:scale(1);}
  .modal-emoji{font-size:2.5rem;}
  .modal h2{margin:8px 0; font-size:1.3rem;}
  .modal p{color:var(--muted); font-size:.9rem; margin:0 0 20px;}
</style>
</head>
<body>
  <div class="app">
    <div class="badge">💻 Reason Countdown</div>
    <h1>Why I Need a New Laptop</h1>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="counter" id="counter">0 / 26</div>
    <div class="card">
      <div class="number" id="number">?</div>
      <p class="reason" id="reason">Tap below to reveal reason #1</p>
    </div>
    <button class="btn" id="btn">Show Reason 1</button>
  </div>

  <div class="fireworks" id="fireworks"></div>

  <div class="modal-overlay" id="overlay">
    <div class="modal">
      <div class="modal-emoji">😭😭</div>
      <h2>please buy me a laptop😭😭</h2>
      <p>26 real reasons. Zero exaggeration (okay, maybe a little).</p>
      <button class="btn" id="closeBtn">okay I'm convinced 🥺</button>
    </div>
  </div>

<script>
const reasons = [
"I will use it for school until I graduate college.",
"This will greatly boost my academics.",
"This will make me happy and actually take school very seriously.",
"I will be forever grateful.",
"My Acer laptop is broken again.",
"My Acer laptop is barely usable — constantly overheating, lagging, very slow, weak, broken speakers, and more.",
"My current Acer laptop is incredibly outdated and old (10+ years old).",
"My Acer laptop has a broken battery and is not portable.",
"This laptop (Acer Nitro V15) is future-proofed, meaning it can last a few years.",
"School projects today demand heavy multitasking which my current broken, obsolete laptop cannot handle.",
"This laptop has an actually working battery, which will prevent me from accidentally losing data.",
"It's actually portable — I can charge it and bring it anywhere.",
"Lightweight, good build quality, and great performance.",
"Perfectly balances schoolwork demands and personal entertainment such as light gaming.",
"Having a reliable computer drastically reduces daily stress and anxiety about schoolwork failing at the last minute.",
"It will let me comfortably learn programming, video editing, graphics, and advanced software for future career paths.",
"The clear, modern screen and high refresh rate reduce eye strain during long hours of studying and typing.",
"It comes with a built-in webcam and clear microphone setup for online classes, group projects, and meetings.",
"Buying a well-maintained secondhand unit locally saves thousands of pesos compared to retail price.",
"It teaches me responsibility in taking care of a valuable tool and electronic investment.",
"I can use it independently for campus journalism, research drafts, and presentations without borrowing anyone's device.",
"It eliminates the daily frustration of waiting minutes just for a single app or webpage to load.",
"A modern, tactile keyboard makes typing long essays and requirements much faster and more comfortable.",
"Having a proper setup keeps me focused and productive at home instead of struggling with tech issues.",
"It ensures I have the right tools to succeed and keep up with school and beyond.",
"My 1st sister has a MacBook, a laptop, and an iPhone. My 2nd sister has an iPhone, iPad, cellphone, and laptop. My brother has a cellphone, laptop, and an iPad. Meanwhile, I only have a cellphone and a single broken laptop."
];

let idx = 0;
const numberEl = document.getElementById('number');
const reasonEl = document.getElementById('reason');
const counterEl = document.getElementById('counter');
const barEl = document.getElementById('bar');
const btn = document.getElementById('btn');
const fireworksEl = document.getElementById('fireworks');
const overlay = document.getElementById('overlay');

btn.addEventListener('click', () => {
  if (idx >= 26) return;
  idx++;
  numberEl.textContent = idx;
  numberEl.classList.remove('pop');
  void numberEl.offsetWidth;
  numberEl.classList.add('pop');
  reasonEl.textContent = reasons[idx-1];
  counterEl.textContent = idx + ' / 26';
  barEl.style.width = (idx/26*100) + '%';

  if (idx < 26) {
    btn.textContent = 'Next Reason →';
  } else {
    btn.textContent = 'Reveal the truth 🎆';
    btn.disabled = true;
    setTimeout(launchFireworks, 500);
  }
});

function launchFireworks(){
  let bursts = 0;
  function burst(){
    const shell = document.createElement('div');
    shell.className = 'shell';
    shell.style.left = (35 + Math.random()*30) + '%';
    fireworksEl.appendChild(shell);
    shell.addEventListener('animationend', () => {
      const rect = shell.getBoundingClientRect();
      shell.remove();
      explode(rect.left, rect.top);
    });
    bursts++;
    if (bursts < 3) setTimeout(burst, 450);
    else setTimeout(() => overlay.classList.add('show'), 1100);
  }
  burst();
}

function explode(x, y){
  const colors = ['#ff6b6b','#ffd93d','#6bcBef'.replace('B','b'),'#8b5cf6','#f472b6','#4ade80'];
  for (let i = 0; i < 24; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI * 2 * i) / 24;
    const dist = 70 + Math.random() * 60;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    fireworksEl.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

document.getElementById('closeBtn').addEventListener('click', () => {
  overlay.classList.remove('show');
});
</script>
</body>
</html>
